name: update

on:
  schedule:
    # 30分ごとの更新は timer.yml が起動する。この cron は予備
    # (GitHub 側で大きく間引かれ、2026-08-27 ごろから1日に数回しか動かない)。
    # 毎時0分/30分はGitHub側の混雑でスキップされやすいため中途半端な分にずらす
    - cron: "13,43 * * * *"
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # "pages" は 2026-10-18 に実行が Queued のまま進まなくなったため改名。
  # 実行中のデプロイを打ち切ると Pages 側で固まる (8/6 に発生) のでキャンセルしない
  group: update-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # 前回デプロイした分 (記事本文・世界ニュースの蓄積) を取りに行く公開URL
      PAGES_BASE: https://tsuyoshistyleball-collab.github.io/warota
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch feeds
        run: node scripts/fetch.mjs
      # 世界ニュース (地域別の話題TOP10)。失敗してもまとめの更新は止めない
      - name: Fetch world news
        run: node scripts/fetch-world.mjs
        continue-on-error: true
      - name: Install extractor deps
        run: npm install --no-save --no-package-lock --no-audit --no-fund linkedom @mozilla/readability @anthropic-ai/sdk
      # 世界ニュースの話題ごとに各社の記事を読んで要約する。リポジトリの Secrets に ANTHROPIC_API_KEY があれば
      # Claude で分かりやすくまとめ、なければ記事の冒頭の文を使う。失敗しても配信元の概要文で表示できるので止めない
      - name: Summarize world news
        run: node scripts/world-digest.mjs
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Build reader articles
        run: node scripts/build-articles.mjs
      # debug-urls.txt にURLを書いておくと抽出診断がログに出る (メンテ用)
      - name: Debug extract
        if: ${{ hashFiles('debug-urls.txt') != '' }}
        run: |
          while IFS= read -r u; do
            [ -z "$u" ] && continue
            echo "================ DEBUG: $u"
            node scripts/debug-extract.mjs "$u" || true
          done < debug-urls.txt
      - uses: actions/configure-pages@v5
        with:
          # Pages 未設定でもワークフローが自動で有効化する
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4

  # 公開リポジトリは60日間コミットがないと GitHub が定期実行を自動停止するため
  # (2026-10-16 に実際に停止した)、最後のコミットから50日経ったら空コミットを積む。
  # 書き込み権限は外部の記事を扱う上のジョブには渡さず、このジョブだけに付ける
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Keep schedule alive
        run: |
          days=$(( ($(date +%s) - $(git log -1 --format=%ct)) / 86400 ))
          echo "最後のコミットから ${days} 日経過"
          if [ "$days" -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive: 定期実行の自動停止を防ぐ空コミット"
            git push
          fi
