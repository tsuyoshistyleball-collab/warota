name: update

on:
  schedule:
    # 30分ごとに記事を再取得して再デプロイ (UTC)。
    # 毎時0分/30分はGitHub側の混雑でスキップされやすいため中途半端な分にずらす
    - cron: "13,43 * * * *"
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch feeds
        run: node scripts/fetch.mjs
      - name: Install extractor deps
        run: npm install --no-save --no-package-lock --no-audit --no-fund linkedom @mozilla/readability
      - name: Build reader articles
        run: node scripts/build-articles.mjs
        env:
          PAGES_BASE: https://tsuyoshistyleball-collab.github.io/warota
      # debug-urls.txt にURLを書いておくと抽出診断がログに出る (メンテ用)
      - name: Debug extract
        if: ${{ hashFiles('debug-urls.txt') != '' }}
        run: |
          while IFS= read -r u; do
            [ -z "$u" ] && continue
            echo "================ DEBUG: $u"
            node scripts/debug-extract.mjs "$u" || true
          done < debug-urls.txt
      # 一時対応: サーバー側で進行中のまま固まったデプロイをキャンセルして詰まりを解消する
      - name: Cancel stuck Pages deployment
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/deployments/dfd6049725365d9b6017a21160b046f1319125ed/cancel" || true
      - uses: actions/configure-pages@v5
        with:
          # Pages 未設定でもワークフローが自動で有効化する
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
