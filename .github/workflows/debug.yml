name: debug

# 特定の記事URLで本文抽出の挙動を調べるメンテナンス用ワークフロー
on:
  workflow_dispatch:
    inputs:
      url:
        description: "調査する記事URL"
        required: true
      base:
        description: "比べる前の版 (コミットかブランチ)。audit の簡易表示で、抽出結果の違いを出す"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  debug-extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock --no-audit --no-fund linkedom @mozilla/readability
      - if: github.event.inputs.base != ''
        env:
          BASE: ${{ github.event.inputs.base }}
        run: |
          # ブランチ名か、このブランチの最近のコミット (短い番号でもよい)
          git fetch --no-tags --depth=100 origin "$GITHUB_REF"
          if git fetch --no-tags --depth=1 origin "$BASE" 2>/dev/null; then REV=FETCH_HEAD; else REV="$BASE"; fi
          git show "$REV:scripts/build-articles.mjs" > scripts/build-articles.base.mjs
      - run: node scripts/debug-extract.mjs "${{ github.event.inputs.url }}"
