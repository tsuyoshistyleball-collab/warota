name: timer

# update を30分ごとに動かすためのタイマー。
# GitHub の定期実行 (update.yml の cron) は 2026-08-27 ごろから大きく間引かれ、
# 1日48回の予定に対して3〜8回しか動かなくなった。そこでこのワークフローが
# 「30分待つ → 次の timer と update を起動する」をくり返す。
# 30分の待ち時間は環境 update-timer の Wait timer で作るので、待っている間はマシンを使わない
# (利用時間にも数えられない)。設定は Settings → Environments → update-timer →
# 「Wait timer」にチェックして 30 → 「Save protection rules」
on:
  workflow_dispatch:
  # タイマーが止まったとき (GitHub の障害など) に起動し直す予備。この cron も間引かれるが、1日に数回動けば足りる
  schedule:
    - cron: "7,37 * * * *"

permissions:
  actions: write

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}

jobs:
  next:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: update-timer
      # 待つためだけに使う環境なので、デプロイの記録は作らない
      deployment: false
    # タイマーの実行は1本ずつ順番に進める
    concurrency:
      group: update-timer
      cancel-in-progress: false
    steps:
      - name: Start the next timer and update
        run: |
          retry() { for i in 1 2 3; do "$@" && return 0; sleep 20; done; return 1; }
          created=$(retry gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          waited=$(( ($(date +%s) - $(date -d "$created" +%s)) / 60 ))
          echo "起動から ${waited} 分経過"
          # Wait timer がないと待たずに次を起動し続け、update が何百回も動いてしまうので止める
          if [ "$waited" -lt 10 ]; then
            echo "::warning::環境 update-timer の Wait timer (30分) が設定されていないため、タイマーを止めました"
            exit 0
          fi
          # 手動の起動などでタイマーが2本になったら、新しいほうだけを残す
          # (2時間より前から終わらない実行は、GitHub 側で固まったものとみなして数えない)
          newer=$(retry gh run list --workflow timer.yml --event workflow_dispatch --limit 20 \
            --json databaseId,status,createdAt --jq "[.[] | select(.status != \"completed\"
              and .databaseId > $GITHUB_RUN_ID and (.createdAt | fromdateiso8601) > now - 7200)] | length")
          if [ "$newer" -gt 0 ]; then
            echo "新しいタイマーが動いているので、こちらは終わります"
            exit 0
          fi
          # タイマーが途切れないよう、次の timer を先に起動する
          retry gh workflow run timer.yml --ref "$BRANCH"
          retry gh workflow run update.yml --ref "$BRANCH"

  restart:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Restart the timer if it has stopped
        run: |
          retry() { for i in 1 2 3; do "$@" && return 0; sleep 20; done; return 1; }
          # 動いているタイマー (2時間より前から終わらないものは除く) がなければ起動し直す
          running=$(retry gh run list --workflow timer.yml --event workflow_dispatch --limit 20 \
            --json status,createdAt --jq "[.[] | select(.status != \"completed\"
              and (.createdAt | fromdateiso8601) > now - 7200)] | length")
          if [ "$running" -gt 0 ]; then
            echo "タイマーは動いています"
          else
            echo "タイマーが止まっていたので起動し直します"
            retry gh workflow run timer.yml --ref "$BRANCH"
          fi
