<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>わろたんてな</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="ptr" aria-hidden="true"><span></span></div>

<div id="views">
<section id="view-world" aria-label="世界のニュース">
  <div id="w-home">
    <header class="w-head">
      <div class="w-title">
        <h1>世界のニュース</h1>
        <p id="w-updated">読み込み中…</p>
      </div>
      <button id="w-refresh" class="icon-btn" aria-label="更新" title="更新"></button>
    </header>

    <div class="map-card">
      <div id="map-stage" class="map-stage">
        <svg id="world-map" class="map-svg" role="img" aria-label="世界地図。指で動かせます。地域を選ぶと話題のニュースを表示します"></svg>
        <div id="map-chips" class="map-chips"></div>
        <p id="map-hint" class="map-hint" hidden>指で動かして、地域をタップ</p>
        <button id="map-reset" class="map-reset" hidden></button>
        <div class="map-legend" aria-hidden="true">落ち着き<i class="legend-bar"></i>話題沸騰</div>
        <div class="map-zoom">
          <button id="map-zoom-in" aria-label="地図を拡大"></button>
          <button id="map-zoom-out" aria-label="地図を縮小"></button>
        </div>
      </div>
    </div>

    <div id="w-main">
      <p id="w-status" class="w-status" hidden></p>

      <h2 class="w-section">地域ごとの話題</h2>
      <div id="region-cards" class="region-cards" aria-busy="true">
        <div class="rcard skeleton"></div>
        <div class="rcard skeleton"></div>
        <div class="rcard skeleton"></div>
      </div>
      <p class="w-credit">地図データ: Natural Earth</p>
    </div>
  </div>

  <aside id="w-side" aria-label="地域のニュース" inert>
    <section id="region-view" class="pane">
      <header class="pane-head">
        <button id="rv-back" class="icon-btn" aria-label="地図に戻る"></button>
        <div class="pane-title">
          <h2><i id="rv-dot" class="rdot"></i><span id="rv-name"></span></h2>
          <p id="rv-sub"></p>
        </div>
      </header>
      <div id="rv-scroll" class="pane-scroll">
        <p id="rv-hint" class="rv-hint" hidden>いま一番話題の地域を表示しています。地図や一覧から地域を選べます</p>
        <div id="rv-map" class="mini-map"></div>
        <ol id="rv-list"></ol>
      </div>
    </section>
    <section id="article-view" class="pane" aria-label="記事の要約">
      <header class="pane-head">
        <button id="av-back" class="icon-btn" aria-label="一覧に戻る"></button>
        <p id="av-crumb" class="av-crumb"></p>
        <button id="av-share" class="icon-btn" aria-label="共有" hidden></button>
      </header>
      <div id="av-scroll" class="pane-scroll">
        <article id="av-body"></article>
      </div>
    </section>
  </aside>
</section>

<section id="view-matome" hidden>
  <header id="header">
    <div class="bar">
      <h1>わろたんてな <span id="app-ver"></span></h1>
      <div class="bar-actions">
        <button id="btn-search" aria-label="検索" title="検索">🔍</button>
        <button id="btn-refresh" aria-label="更新" title="更新">↻</button>
        <button id="btn-settings" aria-label="設定" title="設定">⚙</button>
      </div>
    </div>
    <div id="searchbar" hidden>
      <input id="search" type="search" placeholder="タイトルを検索" autocomplete="off">
    </div>
    <nav id="tabs" aria-label="カテゴリ"></nav>
  </header>

  <main>
    <p id="status" hidden></p>
    <ul id="list"></ul>
    <button id="more" hidden>もっと見る</button>
    <p id="updated"></p>
  </main>
</section>
</div>

<nav id="tabbar" aria-label="画面の切り替え">
  <a href="#/world" data-tab="world" aria-current="page">
    <span class="tab-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.4 2.3 3.5 5.2 3.5 8.5s-1.1 6.2-3.5 8.5c-2.4-2.3-3.5-5.2-3.5-8.5S9.6 5.8 12 3.5z"/></svg></span>
    <span>ワールド</span>
  </a>
  <a href="#/matome" data-tab="matome">
    <span class="tab-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 12.5h8M8 16h5"/></svg></span>
    <span>まとめ</span>
  </a>
</nav>

<div id="reader" hidden>
  <div class="reader-bar">
    <button id="reader-close" aria-label="戻る">←</button>
    <div class="reader-actions">
      <button id="reader-fav" aria-label="お気に入り">☆</button>
      <a id="reader-open" target="_blank" rel="noopener noreferrer">元記事 ↗</a>
    </div>
  </div>
  <div id="reader-scroll">
    <h2 id="reader-title"></h2>
    <p id="reader-meta"></p>
    <div id="reader-content"></div>
    <div id="reader-related"></div>
  </div>
</div>

<div id="settings-modal" class="modal" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <h2>設定</h2>
      <button id="btn-close-settings" aria-label="閉じる">✕</button>
    </div>
    <section>
      <h3>NGワード</h3>
      <p class="hint">カンマか改行区切り。含まれる記事を非表示にします。</p>
      <textarea id="ng-words" rows="3" placeholder="例: 広告, PR"></textarea>
    </section>
    <section>
      <h3>表示するサイト</h3>
      <div id="site-toggles"></div>
    </section>
    <section>
      <h3>その他</h3>
      <label class="row"><input type="checkbox" id="opt-reader"> 記事をアプリ内で開く(広告カット)</label>
      <label class="row"><input type="checkbox" id="opt-hide-read"> 既読の記事を隠す</label>
      <button id="btn-clear-read" class="secondary">既読履歴をリセット</button>
    </section>
  </div>
</div>

<script src="./app.js"></script>
<script src="./world.js"></script>
</body>
</html>
